services:
  face-service:
    build:
      context: ./services/face-service
    container_name: videofacelive-face-service
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/models
      - ./data/workdir:/app/workdir

  backend:
    build:
      context: ./services/backend
    container_name: videofacelive-backend
    env_file:
      - ./.env
    ports:
      - "4000:4000"
    depends_on:
      - face-service

  web:
    build:
      context: ./apps/web
    container_name: videofacelive-web
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
